---
name: "Install Docker CE CLI"
author: "Jake Deery <jake.deery@openfifth.co.uk>"
description: "Installs standalone Docker CE CLI"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -ex
        export DEBIAN_FRONTEND=noninteractive

        apt update
        apt install -y --no-install-recommends ca-certificates curl

        install -v -m 0755 -d /etc/apt/keyrings
        curl -f -s -S -L -o /etc/apt/keyrings/docker.asc https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg
        chmod -v a+r /etc/apt/keyrings/docker.asc

        cat <<EOF | tee /etc/apt/sources.list.d/docker.sources
        Types: deb
        URIs: https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")
        Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
        Components: stable
        Architectures: $(dpkg --print-architecture)
        Signed-By: /etc/apt/keyrings/docker.asc
        EOF

        apt update
        apt install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin sudo

        id docker || adduser --system \
            --shell /usr/sbin/nologin \
            --home /var/lib/docker \
            --no-create-home \
            --disabled-password \
            --gecos '' \
            docker
        usermod -a -G docker docker
