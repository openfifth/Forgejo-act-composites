---
name: "Initialise an environment for Koha-dpkg-docker"
author: "Jake Deery <jake.deery@openfifth.co.uk>"
description: "Initialises tmp directories and env vars for Koha-dpkg-docker to use"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -ex

        export DEBIAN_FRONTEND=noninteractive
        export PERL_MM_USE_DEFAULT=1

        apt update
        apt install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            git \
            perl \
            perl-doc

        cpan -i Modern::Perl IPC::Cmd

        export HELPER_SCRIPT="$(mktemp -d -p /tmp helper-script-XXXXXX)"
        echo HELPER_SCRIPT="$HELPER_SCRIPT" >> ${{ env.FORGEJO_ENV }}
        chmod -v a+rx $HELPER_SCRIPT

        export SYNC_REPO="${{ env.FORGEJO_WORKSPACE }}"
        echo SYNC_REPO="$SYNC_REPO" >> ${{ env.FORGEJO_ENV }}
        chmod -v a+rx $SYNC_REPO

        export DEBS_OUT="$(mktemp -d -p /tmp debs-out-XXXXXX)"
        echo DEBS_OUT="$DEBS_OUT" >> ${{ env.FORGEJO_ENV }}
        chmod -v a+rx $DEBS_OUT

        git rev-parse || perl -I. -MKoha

        export KOHA_AUTO_VERSION="$(perl -I. -MKoha -le 'print $Koha::VERSION' | cut -b 1-5)"
        # unsupported versions
        [[ "$KOHA_AUTO_VERSION" == *".06"* ]] && export KOHA_AUTO_VERSION="unstable"
        [[ "$KOHA_AUTO_VERSION" == *".12"* ]] && export KOHA_AUTO_VERSION="unstable"

        [ -z "$KOHA_VERSION" ] && export KOHA_VERSION="$KOHA_AUTO_VERSION"
        echo KOHA_VERSION="$KOHA_VERSION" >> ${{ env.FORGEJO_ENV }}

        [ -z "$KDD_BRANCH" ] && export KDD_BRANCH="$KOHA_VERSION"
        echo KDD_BRANCH="$KDD_BRANCH" >> ${{ env.FORGEJO_ENV }}

        [ -z "$KDD_IMAGE" ] && export KDD_IMAGE="$KOHA_VERSION"
        echo KDD_IMAGE="$KDD_IMAGE" >> ${{ env.FORGEJO_ENV }}
