---
name: "Install Docker CE"
author: "Jake Deery <jake.deery@openfifth.co.uk>"
description: "Installs standalone Docker CE Daemon and CLI"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -ex
        export DEBIAN_FRONTEND=noninteractive

        apt update
        apt install -y --no-install-recommends ca-certificates curl

        install -v -m 0755 -d /etc/apt/keyrings
        curl -f -s -S -L -o /etc/apt/keyrings/docker.asc https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg
        chmod -v a+r /etc/apt/keyrings/docker.asc

        cat <<EOF | tee /etc/apt/sources.list.d/docker.sources
        Types: deb
        URIs: https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")
        Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
        Components: stable
        Architectures: $(dpkg --print-architecture)
        Signed-By: /etc/apt/keyrings/docker.asc
        EOF

        apt update
        apt install -y --no-install-recommends \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin \
            sudo

        id docker || adduser --system \
            --shell /usr/sbin/nologin \
            --home /var/lib/docker \
            --no-create-home \
            --disabled-password \
            --gecos '' \
            docker
        usermod -a -G docker docker

        mkdir -v -p /run/containerd
        systemctl start containerd.service

        while [ ! -S "/run/containerd/containerd.sock" ]; do
            sleep 0.05
        done

        mkdir -v -p /run
        systemctl start docker.service

        while [ ! -S "/run/docker.sock" ]; do
            sleep 0.05
        done
